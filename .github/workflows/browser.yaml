# Build, check, sign and publish agentry-browser, the browser server image:
# Microsoft's @playwright/mcp and Debian's Chromium, on our debian:trixie-slim
# mirror, to ghcr.io/blaktron.
#
# Dispatched by hand, from main only: a run with packages: write can push any
# tag this repository's packages hold, so a branch's workflow file never gets
# that. Each run is tagged with its UTC date and run number and refuses a tag
# that exists, so a rebuild is a new tag and a new digest; the
# agentry-browser row in images.tsv then takes it, and the CLI pins that
# digest.
#
# The server comes from package-lock.json (npm ci --ignore-scripts) on our
# node:24-bookworm-slim mirror; Chromium, its libraries and the fonts from
# snapshot.debian.org at source.env's timestamp, the chromium package held to
# source.env's version and SHA-256. Those fetches happen here, once, and never
# inside a person's run. The base mirrors (agentry-debian,
# agentry-node-bookworm) must exist first: the images workflow mirrors the
# named rows.
#
# Each architecture is built natively, amd64 on ubuntu-latest and arm64 on
# ubuntu-24.04-arm, and run hardened with no network (scripts/check.sh
# --browser-image: Debian's Chromium and no proprietary browser file, the
# fixture page rendered, a screenshot and a PDF, a secret typed by name and
# masked, no ECH in the ClientHello, and the control) before it is pushed.
# Each build job hands the merge the digest it pushed, never a tag: the merge
# joins those digests, holds the joined index to listing exactly them, checks
# it by digest, and signs that same digest with cosign, keyless, as this
# workflow on main (id-token: write, in that job alone). The signature is
# verified against that identity before the run reports the images.tsv row.
# A tag can be re-pointed by anything holding packages: write; a digest
# cannot, so what is signed is what was checked. This repository is public,
# so both runners are free, and each is a fresh virtual machine per job.
# Pushing uses the workflow's GITHUB_TOKEN; a package this workflow creates
# is public.
name: browser

on:
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail, so a `| tee` never hides a failure.
defaults:
  run:
    shell: bash

concurrency:
  group: browser
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Refuse any branch but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::dispatch this workflow from main; it pushes and signs public images"
          exit 1

      # TODO: pin by commit SHA.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the manifest, the scripts and the workflows
        run: ./scripts/check.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Choose the tag, the UTC date and the run number, and refuse one that exists
        id: tag
        run: |
          set -euo pipefail
          tag="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          if docker buildx imagetools inspect "ghcr.io/blaktron/agentry-browser:$tag" >/dev/null 2>&1; then
            echo "::error::ghcr.io/blaktron/agentry-browser:$tag exists; a rebuild is a new tag"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      # Each architecture checks and pushes on its own; a re-run of a failed
      # job completes the pair. The merge waits for both.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Longer than hostlink's 30: Chromium and its libraries from the snapshot
    # archive, which is slow, and a browser check.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build this architecture
        run: |
          ./scripts/build.sh agentry-browser
          docker image inspect "ghcr.io/blaktron/agentry-browser:$IMAGE_TAG-${PLATFORM##*/}" --format 'image size: {{.Size}} bytes'

      - name: Run it hardened with no network (fixture page, secret, ClientHello, control)
        run: ./scripts/check.sh --browser-image "ghcr.io/blaktron/agentry-browser:$IMAGE_TAG-${PLATFORM##*/}"

      - name: Push this architecture and record the digest it pushed
        run: |
          set -euo pipefail
          docker push "ghcr.io/blaktron/agentry-browser:$IMAGE_TAG-${PLATFORM##*/}" | tee push.out
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.out | tail -1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the push"; exit 1; }
          mkdir -p digest
          echo "${PLATFORM##*/}=$digest" >"digest/${PLATFORM##*/}"
          echo "pushed ${PLATFORM##*/} as $digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.runner }}
          path: digest/
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # cosign's keyless signature: the workflow's OIDC identity is the
      # signing identity the CLI's pin check and the sandbox hosts verify.
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/browser.yaml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Join the checked digests into one tag
        run: |
          set -euo pipefail
          PART_DIGESTS=$(cat digest/* | tr '\n' ' ')
          export PART_DIGESTS
          echo "parts: $PART_DIGESTS"
          ./scripts/build.sh --merge agentry-browser | tee merge.out
          digest=$(sed -n 's/^merged; digest: //p' merge.out)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the merge"; exit 1; }
          echo "DIGEST=$digest" >>"$GITHUB_ENV"

      - name: Check the joined digest the same way
        env:
          PLATFORM: linux/amd64
        run: ./scripts/check.sh --browser-image "ghcr.io/blaktron/agentry-browser@$DIGEST"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the joined digest, keyless
        run: cosign sign --yes "ghcr.io/blaktron/agentry-browser@$DIGEST"

      - name: Verify the signature against this workflow's identity
        run: |
          cosign verify "ghcr.io/blaktron/agentry-browser@$DIGEST" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          echo "verified $DIGEST as $IDENTITY"

      - name: Write the images.tsv row and the signing identity to the run's summary
        run: |
          set -euo pipefail
          # The role names the pinned server and browser, so it is read from
          # source.env rather than written here a second time.
          # shellcheck source=/dev/null
          . build/agentry-browser/source.env
          row=$(printf 'agentry-browser\tghcr.io/blaktron/agentry-browser:%s\t%s\tbuild\t%s' "$IMAGE_TAG" "$DIGEST" \
            "the browser server image: @playwright/mcp $MCP_VERSION from its lockfile and Debian's Chromium $CHROMIUM_DEB_VERSION (snapshot $DEBIAN_SNAPSHOT) held to its SHA-256, with its Chromium policy (ECH and QUIC off), on our debian:trixie-slim mirror, uid 10001, amd64 and arm64, signed keyless by the browser workflow (agentry-cli's browser server)")
          {
            echo "### agentry-browser:$IMAGE_TAG"
            echo
            echo '```'
            echo "$row"
            echo '```'
            echo
            echo "Signed keyless; verify with:"
            echo
            echo '```'
            echo "cosign verify ghcr.io/blaktron/agentry-browser@$DIGEST --certificate-identity $IDENTITY --certificate-oidc-issuer $ISSUER"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$row"
