# Mirror and build the runtime images into ghcr.io/blaktron.
#
# Manual dispatch only: a run is needed when a pin in images.tsv moves, not on
# every push, and Docker Hub rate-limits anonymous pulls per IP, so an
# automatic run could fail for reasons unrelated to the change.
#
# Runs on ubuntu-latest because no self-hosted runner is registered for this
# repository. Pushing to GHCR uses the workflow's GITHUB_TOKEN with
# packages: write. A package this workflow creates in a public repository is
# public by default.
name: images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin by commit SHA (agentry-cli#165).
      - uses: actions/checkout@v4

      # The same check the ci workflow runs on every pull request.
      - name: Check the manifest, the scripts and the workflows
        run: ./scripts/check.sh

      - name: Report which upstream tags have moved
        run: ./scripts/pin.sh
        continue-on-error: true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Docker Hub allows 100 anonymous pulls per IP: an hour by its response
      # header, six hours by its documentation. A full mirror run can exceed
      # either. Set these two secrets to pull as an account; without them the
      # run may hit a 429.
      - name: Log in to Docker Hub when credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set, so this pulls from Docker Hub anonymously, limited to 100 pulls per IP, which a full mirror run can exceed"
          fi

      - name: Mirror every mirrored image
        run: ./scripts/mirror.sh

      - name: Build every built image
        run: |
          set -euo pipefail
          for ctx in build/*/; do
            name=$(basename "$ctx")
            echo "::group::$name"
            PUSH=1 ./scripts/build.sh "$name" || {
              echo "::error::build/$name failed or is blocked on an unmirrored base"
              exit 1
            }
            echo "::endgroup::"
          done
